<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valheim Items Database</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-darker: #0d141e;
            --bg-dark: #171a21;
            --bg-card: #1b2838;
            --bg-card-hover: #223246;
            --text-primary: #f3f3f3;
            --text-secondary: #c6d4df;
            --text-muted: #8b9eaf;
            --primary: #66c0f4;
            --primary-hover: #8cd1f8;
            --accent: #4c6c8c;
            --border: #2a3f5a;
            --transition: all 0.2s ease-in-out;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            padding: 20px;
            line-height: 1.5;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Header */
        header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px 0;
            border-bottom: 1px solid var(--border);
        }

        header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        header h1 span {
            color: var(--primary);
        }

        header p {
            color: var(--text-muted);
            font-size: 1rem;
        }

        /* Controls Panel */
        .controls {
            background-color: var(--bg-darker);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 30px;
            display: grid;
            grid-template-columns: 2fr 1.2fr 1.2fr 1fr 1.2fr;
            gap: 15px;
            align-items: end;
        }

        @media (max-width: 900px) {
            .controls {
                grid-template-columns: 1fr;
            }
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .control-group label {
            font-size: 0.85rem;
            color: var(--text-muted);
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .input-field {
            background-color: var(--bg-dark);
            border: 1px solid var(--border);
            color: var(--text-primary);
            padding: 10px 14px;
            border-radius: 8px;
            font-family: inherit;
            font-size: 0.95rem;
            width: 100%;
            outline: none;
            transition: var(--transition);
        }

        .input-field:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 2px rgba(102, 192, 244, 0.2);
        }

        /* Stats & Active Filters */
        .summary-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .stats strong {
            color: var(--text-primary);
        }

        /* Grid Layout */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 20px;
        }

        /* Card Style */
        .card {
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: var(--transition);
            position: relative;
        }

        .card:hover {
            transform: translateY(-4px);
            border-color: var(--primary);
            background-color: var(--bg-card-hover);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
        }

        .card-header {
            padding: 20px;
            display: flex;
            gap: 15px;
            align-items: center;
            border-bottom: 1px solid var(--border);
        }

        .img-container {
            width: 64px;
            height: 64px;
            background-color: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--border);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            overflow: hidden;
        }

        .img-container img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .title-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
            flex-grow: 1;
            min-width: 0;
        }

        .item-category {
            font-size: 0.75rem;
            color: var(--primary);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .item-name {
            font-size: 1.15rem;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .card-body {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            flex-grow: 1;
        }

        /* ID Copy Badge */
        .id-badge {
            display: inline-flex;
            align-items: center;
            justify-content: space-between;
            background-color: rgba(0, 0, 0, 0.25);
            border: 1px dashed var(--border);
            border-radius: 6px;
            padding: 6px 12px;
            font-family: monospace;
            font-size: 0.8rem;
            color: var(--text-secondary);
            cursor: pointer;
            width: 100%;
            transition: var(--transition);
            white-space: nowrap;
        }

        .id-badge:hover {
            border-color: var(--primary);
            color: var(--primary);
            background-color: rgba(102, 192, 244, 0.05);
        }

        .id-badge::after {
            content: "📋";
            font-size: 0.8rem;
        }

        .id-badge.copied::after {
            content: "✓";
            color: #5cbf5c;
        }

        /* Biomes */
        .meta-section {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .meta-title {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .badge-container {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .badge {
            font-size: 0.75rem;
            background-color: var(--accent);
            color: var(--text-primary);
            padding: 3px 8px;
            border-radius: 4px;
            font-weight: 500;
            white-space: nowrap;
        }

        .badge.all-biomes {
            background-color: #7a5f27;
        }

        /* Sources List */
        .sources-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .sources-list li {
            font-size: 0.85rem;
            color: var(--text-secondary);
            display: flex;
            align-items: flex-start;
            gap: 6px;
        }

        .sources-list li::before {
            content: "•";
            color: var(--primary);
            font-weight: bold;
        }

        /* Empty State */
        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
            border: 2px dashed var(--border);
            border-radius: 12px;
            background-color: var(--bg-darker);
        }

        .empty-state h3 {
            font-size: 1.3rem;
            color: var(--text-primary);
            margin-bottom: 8px;
        }

        /* Layout Switcher */
        .view-switcher {
            display: flex;
            background-color: var(--bg-darker);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 2px;
            gap: 2px;
        }

        .view-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.85rem;
            font-weight: 500;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 6px;
            outline: none;
        }

        .view-btn:hover {
            color: var(--text-primary);
        }

        .view-btn.active {
            background-color: var(--primary);
            color: var(--bg-darker);
            font-weight: 600;
        }

        /* List View */
        .list-view {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
        }

        /* List Header Columns */
        .list-header {
            display: flex;
            padding: 10px 20px;
            color: var(--text-muted);
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            border-bottom: 1px solid var(--border);
            margin-bottom: 5px;
            gap: 20px;
            align-items: center;
        }

        .col-item { flex: 0 0 250px; min-width: 0; }
        .col-sources { flex: 1; min-width: 0; }
        .col-biomes { flex: 0 0 200px; min-width: 0; text-align: center; }
        .col-command { flex: 0 0 260px; min-width: 0; text-align: right; }

        .list-row {
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            gap: 20px;
            transition: var(--transition);
        }

        .list-row:hover {
            border-color: var(--primary);
            background-color: var(--bg-card-hover);
        }

        .list-left {
            display: flex;
            align-items: center;
            gap: 15px;
            flex: 0 0 250px;
            min-width: 0;
        }

        .list-img {
            width: 42px;
            height: 42px;
            background-color: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--border);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            overflow: hidden;
        }

        .list-img img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .list-name-section {
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .list-name {
            font-size: 1rem;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .list-category {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .list-middle {
            flex: 1;
            min-width: 0;
        }

        .list-sources {
            font-size: 0.85rem;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow-x: auto;
            display: block;
            line-height: 1.4;
            padding-bottom: 3px;
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        .list-sources::-webkit-scrollbar {
            display: none;
        }

        .list-biomes-col {
            flex: 0 0 200px;
            display: flex;
            justify-content: flex-start;
            align-items: center;
            flex-wrap: nowrap;
            overflow-x: auto;
            gap: 4px;
            min-width: 0;
            padding: 3px 0;
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        .list-biomes-col::-webkit-scrollbar {
            display: none;
        }

        .list-command-col {
            flex: 0 0 260px;
            min-width: 0;
            display: flex;
            justify-content: flex-end;
        }

        @media (max-width: 850px) {
            .list-header {
                display: none;
            }
            .list-row {
                flex-direction: column;
                align-items: stretch;
                gap: 12px;
                padding: 15px;
            }
            .list-left {
                flex: none;
            }
            .list-biomes-col {
                flex: none;
                justify-content: flex-start;
            }
            .list-command-col {
                flex: none;
                justify-content: flex-start;
            }
            .list-command-col .id-badge {
                width: 100% !important;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🛡️ Valheim <span>Items Database</span></h1>
            <p>Интерактивная база данных предметов с быстрым поиском по ID и локациям</p>
        </header>

        <section class="controls">
            <div class="control-group">
                <label for="search">Поиск предметов</label>
                <input type="text" id="search" class="input-field" placeholder="Поиск по названию, ID, добыче...">
            </div>

            <div class="control-group">
                <label for="main-section">Раздел</label>
                <select id="main-section" class="input-field">
                    <option value="all">Все разделы</option>
                </select>
            </div>

            <div class="control-group">
                <label for="subcategory">Подкатегория</label>
                <select id="subcategory" class="input-field">
                    <option value="all">Все подкатегории</option>
                </select>
            </div>

            <div class="control-group">
                <label for="biome">Биом / Этап</label>
                <div style="display: flex; gap: 8px;">
                    <select id="biome" class="input-field" style="flex: 1;">
                        <option value="all">Все биомы</option>
                    </select>
                    <select id="biome-mode" class="input-field" style="width: 105px; padding: 10px 4px; font-size: 0.82rem;" title="Режим фильтрации">
                        <option value="stage">Доступно</option>
                        <option value="exact">Точно</option>
                    </select>
                </div>
            </div>

            <div class="control-group">
                <label for="sort">Сортировка</label>
                <select id="sort" class="input-field">
                    <option value="name-asc">По названию (А-Я)</option>
                    <option value="name-desc">По названию (Я-А)</option>
                    <option value="category">По категориям</option>
                </select>
            </div>
        </section>

        <div class="summary-bar">
            <div style="display: flex; gap: 20px; align-items: center;">
                <div class="stats">Найдено предметов: <strong id="items-count">0</strong></div>
                <div class="stats">Всего категорий: <strong id="categories-count">0</strong></div>
            </div>
            <div class="view-switcher">
                <button class="view-btn" id="grid-view-btn" onclick="setView('grid')">🎴 Карточки</button>
                <button class="view-btn active" id="list-view-btn" onclick="setView('list')">📋 Список</button>
            </div>
        </div>

        <main id="items-grid" class="list-view">
            <!-- Items loaded dynamically -->
        </main>
    </div>

    <script>
        let database = { mainSections: [], categories: [] };
        let allItems = [];
        let currentView = 'list';

        const biomeOrder = ["Луга", "Чёрный лес", "Болота", "Горы", "Равнины", "Туманные земли", "Пепельные земли"];

        // DOM elements
        const searchInput = document.getElementById('search');
        const mainSectionSelect = document.getElementById('main-section');
        const subcategorySelect = document.getElementById('subcategory');
        const biomeSelect = document.getElementById('biome');
        const biomeModeSelect = document.getElementById('biome-mode');
        const sortSelect = document.getElementById('sort');
        const itemsGrid = document.getElementById('items-grid');
        const itemsCount = document.getElementById('items-count');
        const categoriesCount = document.getElementById('categories-count');

        // View Toggling
        function setView(view) {
            currentView = view;
            document.getElementById('grid-view-btn').classList.toggle('active', view === 'grid');
            document.getElementById('list-view-btn').classList.toggle('active', view === 'list');
            
            const gridEl = document.getElementById('items-grid');
            if (view === 'grid') {
                gridEl.className = 'grid';
            } else {
                gridEl.className = 'list-view';
            }
            renderItems();
        }

        // Update Subcategories Dropdown dynamically based on selected Main Section
        function updateSubcategoriesDropdown() {
            const selectedSection = mainSectionSelect.value;
            
            // Clear current options except "All"
            subcategorySelect.innerHTML = '<option value="all">Все подкатегории</option>';
            
            // Filter and populate subcategories
            database.categories.forEach(category => {
                if (selectedSection === 'all' || category.mainSectionId === selectedSection) {
                    const option = document.createElement('option');
                    option.value = category.id;
                    option.textContent = `${category.emoji || ''} ${category.title}`;
                    subcategorySelect.appendChild(option);
                }
            });
        }

        // Init database loading
        async function loadDatabase() {
            try {
                const response = await fetch('items_db.json');
                database = await response.json();
                
                // Populate main sections dropdown
                database.mainSections.forEach(section => {
                    const option = document.createElement('option');
                    option.value = section.id;
                    option.textContent = `${section.emoji || ''} ${section.title}`;
                    mainSectionSelect.appendChild(option);
                });

                // Populate subcategories dropdown (initial state shows all)
                updateSubcategoriesDropdown();

                // Process database to a flat list
                allItems = [];
                const biomesSet = new Set();

                database.categories.forEach(category => {
                    category.items.forEach(item => {
                        allItems.push({
                            ...item,
                            categoryId: category.id,
                            categoryTitle: category.title,
                            categoryEmoji: category.emoji,
                            mainSectionId: category.mainSectionId,
                            stage: item.stage || "Луга"
                        });

                        if (item.biomes) {
                            item.biomes.forEach(b => {
                                if (b && b !== "Все" && b !== "—") {
                                    biomesSet.add(b);
                                }
                            });
                        }
                    });
                });

                // Populate biomes dropdown sorted chronologically
                const sortedBiomes = Array.from(biomesSet).sort((a, b) => {
                    return biomeOrder.indexOf(a) - biomeOrder.indexOf(b);
                });

                sortedBiomes.forEach(biome => {
                    const option = document.createElement('option');
                    option.value = biome;
                    option.textContent = biome;
                    biomeSelect.appendChild(option);
                });

                // Render page
                renderItems();

            } catch (error) {
                console.error("Error loading items database:", error);
                itemsGrid.innerHTML = `
                    <div class="empty-state">
                        <h3>Ошибка загрузки</h3>
                        <p>Не удалось прочитать файл базы данных items_db.json</p>
                    </div>
                `;
            }
        }

        // Render function
        function renderItems() {
            const searchQuery = searchInput.value.toLowerCase().trim();
            const mainSectionFilter = mainSectionSelect.value;
            const subcategoryFilter = subcategorySelect.value;
            const biomeFilter = biomeSelect.value;
            const biomeMode = biomeModeSelect.value;
            const sortVal = sortSelect.value;

            // 1. Filter items
            let filtered = allItems.filter(item => {
                // Main Section match
                if (mainSectionFilter !== 'all' && item.mainSectionId !== mainSectionFilter) {
                    return false;
                }

                // Subcategory match
                if (subcategoryFilter !== 'all' && item.categoryId !== subcategoryFilter) {
                    return false;
                }

                // Biome / Stage match
                if (biomeFilter !== 'all') {
                    if (biomeMode === 'exact') {
                        // Exact match
                        if (!item.biomes || (!item.biomes.includes(biomeFilter) && !item.biomes.includes('Все'))) {
                            return false;
                        }
                    } else {
                        // Chronological stage match
                        const itemStageIndex = biomeOrder.indexOf(item.stage);
                        const filterStageIndex = biomeOrder.indexOf(biomeFilter);
                        if (itemStageIndex === -1 || filterStageIndex === -1 || itemStageIndex > filterStageIndex) {
                            return false;
                        }
                    }
                }

                // Search query match
                if (searchQuery) {
                    const nameMatch = item.name.toLowerCase().includes(searchQuery);
                    const idMatch = item.id.toLowerCase().includes(searchQuery);
                    const biomeMatch = item.biomes && item.biomes.some(b => b.toLowerCase().includes(searchQuery));
                    const sourceMatch = item.sources && item.sources.some(s => s.toLowerCase().includes(searchQuery));
                    
                    return nameMatch || idMatch || biomeMatch || sourceMatch;
                }

                return true;
            });

            // 2. Sort items
            if (sortVal === 'name-asc') {
                filtered.sort((a, b) => a.name.localeCompare(b.name));
            } else if (sortVal === 'name-desc') {
                filtered.sort((a, b) => b.name.localeCompare(a.name));
            } else if (sortVal === 'category') {
                filtered.sort((a, b) => a.categoryTitle.localeCompare(b.categoryTitle) || a.name.localeCompare(b.name));
            }

            // 3. Update stats
            itemsCount.textContent = filtered.length;
            categoriesCount.textContent = database.categories.length;

            // 4. Render HTML
            if (filtered.length === 0) {
                itemsGrid.innerHTML = `
                    <div class="empty-state">
                        <h3>Предметы не найдены</h3>
                        <p>Попробуйте изменить поисковый запрос или сбросить фильтры.</p>
                    </div>
                `;
                return;
            }

            if (currentView === 'grid') {
                itemsGrid.innerHTML = filtered.map(item => {
                    const biomeBadges = item.biomes && item.biomes.length > 0
                        ? item.biomes.map(b => `<span class="badge ${b === 'Все' ? 'all-biomes' : ''}">${b}</span>`).join('')
                        : `<span class="badge" style="background-color:#444;">—</span>`;

                    const sourcesLi = item.sources && item.sources.length > 0
                        ? item.sources.map(s => `<li>${s}</li>`).join('')
                        : `<li>Нет информации</li>`;

                    return `
                        <article class="card">
                            <div class="card-header">
                                <div class="img-container">
                                    <img src="${item.image}" alt="${item.name}" onerror="this.src='https://placehold.co/64?text=?';">
                                </div>
                                <div class="title-info">
                                    <span class="item-category">${item.categoryEmoji || ''} ${item.categoryTitle}</span>
                                    <h2 class="item-name" title="${item.name}">${item.name}</h2>
                                </div>
                            </div>
                            <div class="card-body">
                                <div class="meta-section">
                                    <span class="meta-title">Команда спавна (клик для копирования)</span>
                                    <div class="id-badge" onclick="copyToClipboard('${item.spawnCommand}', this)" title="Нажмите, чтобы скопировать команду">
                                        ${item.spawnCommand}
                                    </div>
                                </div>
                                
                                <div class="meta-section">
                                    <span class="meta-title">Биомы</span>
                                    <div class="badge-container">
                                        ${biomeBadges}
                                    </div>
                                </div>

                                <div class="meta-section">
                                    <span class="meta-title">Как добыть</span>
                                    <ul class="sources-list">
                                        ${sourcesLi}
                                    </ul>
                                </div>
                            </div>
                        </article>
                    `;
                }).join('');
            } else {
                const headerHtml = `
                    <div class="list-header">
                        <div class="col-item">Предмет</div>
                        <div class="col-sources">Источники добычи</div>
                        <div class="col-biomes">Биомы</div>
                        <div class="col-command">Команда спавна</div>
                    </div>
                `;
                
                const rowsHtml = filtered.map(item => {
                    const biomeBadges = item.biomes && item.biomes.length > 0
                        ? item.biomes.map(b => `<span class="badge ${b === 'Все' ? 'all-biomes' : ''}">${b}</span>`).join('')
                        : `<span class="badge" style="background-color:#444;">—</span>`;

                    const sourcesText = item.sources && item.sources.length > 0
                        ? item.sources.join(', ')
                        : 'Нет информации';

                    return `
                        <article class="list-row">
                            <div class="list-left">
                                <div class="list-img">
                                    <img src="${item.image}" alt="${item.name}" onerror="this.src='https://placehold.co/64?text=?';">
                                </div>
                                <div class="list-name-section">
                                    <h2 class="list-name" title="${item.name}">${item.name}</h2>
                                    <span class="list-category">${item.categoryEmoji || ''} ${item.categoryTitle}</span>
                                </div>
                            </div>
                            <div class="list-middle">
                                <span class="list-sources" title="${sourcesText}">${sourcesText}</span>
                            </div>
                            <div class="list-biomes-col">
                                ${biomeBadges}
                            </div>
                            <div class="list-command-col">
                                <div class="id-badge" style="width:240px; margin:0;" onclick="copyToClipboard('${item.spawnCommand}', this)" title="Скопировать команду">
                                    ${item.spawnCommand}
                                </div>
                            </div>
                        </article>
                    `;
                }).join('');

                itemsGrid.innerHTML = headerHtml + rowsHtml;
            }
        }

        // Copy helper
        function copyToClipboard(text, element) {
            navigator.clipboard.writeText(text).then(() => {
                element.classList.add('copied');
                setTimeout(() => {
                    element.classList.remove('copied');
                }, 1500);
            }).catch(err => {
                console.error('Could not copy text: ', err);
            });
        }

        // Event listeners
        searchInput.addEventListener('input', renderItems);
        
        mainSectionSelect.addEventListener('change', () => {
            updateSubcategoriesDropdown();
            renderItems();
        });
        
        subcategorySelect.addEventListener('change', renderItems);
        biomeSelect.addEventListener('change', renderItems);
        biomeModeSelect.addEventListener('change', renderItems);
        sortSelect.addEventListener('change', renderItems);

        // Load DB on startup
        loadDatabase();
    </script>
</body>
</html>
